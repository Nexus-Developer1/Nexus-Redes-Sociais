<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
  .post {
    position: relative; width: 1080px; height: 1080px; box-sizing: border-box;
    padding: 90px; color: #fff;
    background: radial-gradient(circle at 85% 10%, #2fbf71 0%, transparent 45%),
                linear-gradient(150deg, #0b5d3b 0%, #08442c 55%, #052e1e 100%);
    display: flex; flex-direction: column;
  }
  /* rede de nós ao fundo (ideia de "nexus") */
  .net { position: absolute; inset: 0; opacity: .18; }
  .logo { display: flex; align-items: center; gap: 18px; position: relative; }
  .mark { width: 64px; height: 64px; }
  .wordmark { font-size: 44px; font-weight: 700; letter-spacing: 10px; }
  .content { margin-top: auto; margin-bottom: auto; position: relative; }
  .tag {
    display: inline-block; padding: 12px 26px; border-radius: 999px;
    background: rgba(255,255,255,.14); border: 2px solid rgba(255,255,255,.35);
    font-size: 30px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
  }
  h1 { font-size: 132px; line-height: 1.0; margin: 40px 0 0; font-weight: 800; letter-spacing: -2px; }
  h1 span { color: #7ef0ad; }
  .date { margin-top: 44px; font-size: 46px; font-weight: 600; display: flex; align-items: center; gap: 20px; }
  .date svg { width: 52px; height: 52px; }
  .footer {
    position: relative; display: flex; justify-content: space-between; align-items: flex-end;
    border-top: 2px solid rgba(255,255,255,.25); padding-top: 34px; font-size: 32px;
  }
  .footer .thanks { font-weight: 600; }
  .footer .back { opacity: .8; text-align: right; }
</style>
</head>
<body>
<div class="post">
  <svg class="net" viewBox="0 0 1080 1080" fill="none" stroke="#fff" stroke-width="2">
    <line x1="700" y1="120" x2="980" y2="300"/><line x1="980" y1="300" x2="860" y2="560"/>
    <line x1="700" y1="120" x2="860" y2="560"/><line x1="860" y1="560" x2="1040" y2="760"/>
    <line x1="980" y1="300" x2="1040" y2="760"/><line x1="580" y1="380" x2="700" y2="120"/>
    <line x1="580" y1="380" x2="860" y2="560"/>
    <g fill="#fff"><circle cx="700" cy="120" r="10"/><circle cx="980" cy="300" r="14"/>
    <circle cx="860" cy="560" r="12"/><circle cx="1040" cy="760" r="9"/><circle cx="580" cy="380" r="8"/></g>
  </svg>

  <div class="logo">
    <svg class="mark" viewBox="0 0 64 64" fill="none">
      <rect x="2" y="2" width="60" height="60" rx="16" fill="#fff"/>
      <path d="M20 44V20l24 24V20" stroke="#0b5d3b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="wordmark">NEXUS</div>
  </div>

  <div class="content">
    <div class="tag">Aviso</div>
    <h1>Amanhã<br>estamos <span>fechados</span></h1>
    <div class="date">
      <svg viewBox="0 0 24 24" fill="none" stroke="#7ef0ad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>
      </svg>
      Sexta-feira, 23 de outubro
    </div>
  </div>

  <div class="footer">
    <div class="thanks">Obrigado pela compreensão.</div>
    <div class="back">Voltamos na segunda-feira</div>
  </div>
</div>
</body>
</html>
